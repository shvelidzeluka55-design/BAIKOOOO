<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>არა 💔</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    overflow: hidden;
}

/* Card */
.card {
    background: white;
    border-radius: 22px;
    padding: 32px 22px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 20px 45px rgba(0,0,0,0.18);
    position: relative;
    z-index: 2;
}

h1 { font-family: 'Playfair Display', serif; font-size: 28px; color: #c9184a; margin-bottom: 16px; }
p { font-size: 18px; color: #333; line-height: 1.5; }

/* Floating emojis */
.floating {
    position: fixed;
    bottom: 0;
    pointer-events: none;
    z-index: 3;
    animation-name: floatUp;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
}

/* Floating hearts & general emojis */
@keyframes floatUp {
    0% { transform: translateY(0); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(-110vh); opacity: 0; }
}

/* Bears drift */
.bear {
    font-size: 30px;
    --driftX: 0px;
}
.bear.floating {
    animation-name: bearFloat;
}
@keyframes bearFloat {
    0% { transform: translate(0px,0) scale(0.6); opacity:0; }
    10% { opacity:1; }
    100% { transform: translate(var(--driftX), -100vh) scale(1); opacity:0; }
}
</style>
</head>
<body>

<div class="card">
    <h1>კარგად დაფიქრდი ბაიკო… 🥺💭</h1>
    <p>ზოგი სიყვარული ჩუმად, მაგრამ სამუდამოდ მოდის ❤️😢</p>
</div>

<script>
// Emojis arrays
const hearts = ["💔","💙","💧"];
const bears = ["🧸","🧸💔"];
const sweets = ["🍫","🍪","🍩","🥺"];

// Function to spawn random floating emoji
function spawnEmoji() {
    const choice = Math.random();
    let emoji = document.createElement("div");
    emoji.classList.add("floating");
    
    if(choice < 0.4){
        emoji.innerHTML = hearts[Math.floor(Math.random()*hearts.length)];
        emoji.style.fontSize = (18+Math.random()*12)+"px";
        emoji.style.left = Math.random()*100+"vw";
        emoji.style.animationDuration = (8+Math.random()*5)+"s"; // slower
    } else if(choice < 0.7){
        emoji.innerHTML = bears[Math.floor(Math.random()*bears.length)];
        emoji.classList.add("bear");
        emoji.style.fontSize = (28+Math.random()*12)+"px";
        emoji.style.left = Math.random()*100+"vw";
        emoji.style.setProperty('--driftX', (Math.random()*100 -50)+"px");
        emoji.style.animationDuration = (6+Math.random()*4)+"s"; // slower
    } else {
        emoji.innerHTML = sweets[Math.floor(Math.random()*sweets.length)];
        emoji.style.fontSize = (20+Math.random()*10)+"px";
        emoji.style.left = Math.random()*100+"vw";
        emoji.style.animationDuration = (5+Math.random()*5)+"s"; // slower
    }
    
    document.body.appendChild(emoji);
    setTimeout(()=>emoji.remove(), 12000);
}

// Spawn emojis continuously
setInterval(spawnEmoji, 500);
</script>

</body>
</html>

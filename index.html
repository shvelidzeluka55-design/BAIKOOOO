<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>გახსენი ბაიკო</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* Same styling as before */
body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    overflow: hidden;
}

/* ... (Include all previous CSS: .bg-heart, .card, buttons, animations, .heart, .bear, etc.) */
</style>
</head>

<body>

<div class="open-link" onclick="openValentine()">გახსენი ბაიკო</div>

<div id="content" class="card">
    <h1>Will You Be My Valentine ბაიკო? 💘</h1>

    <button class="yes" onclick="showYes()">კი ❤️</button>
    <button class="no" id="noBtn" onmouseover="moveNo()" onclick="showNo()">არა 💔</button>
</div>

<script>
const card = document.getElementById("content");

function openValentine() {
    card.classList.add("open");
}

/* Move No button */
function moveNo() {
    const btn = document.getElementById("noBtn");
    const x = Math.random() * 120 - 60;
    const y = Math.random() * 80 - 40;
    btn.style.transform = `translate(${x}px, ${y}px)`;
}

/* Navigate to other pages */
function showYes() {
    window.location.href = "yes.html";
}
function showNo() {
    window.location.href = "no.html";
}
</script>

</body>
</html>

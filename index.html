<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>გახსენი ბაიკო</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    overflow: hidden;
}

/* Card */
.card {
    background: white;
    border-radius: 22px;
    padding: 32px 22px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 20px 45px rgba(0,0,0,0.18);
    transform: rotateX(90deg);
    transform-origin: top;
    transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    position: relative;
    z-index: 2;
}
.card.open { transform: rotateX(0deg); }

h1 { font-family: 'Playfair Display', serif; font-size: 28px; color: #c9184a; margin-bottom: 26px; }

button { width: 100%; padding: 16px; margin: 12px 0; font-size: 20px; border: none; border-radius: 14px; cursor: pointer; }
.yes { background: linear-gradient(135deg, #ff4d6d, #ff758f); color: white; }
.no { background: #adb5bd; color: white; position: relative; }

.open-link { font-family: 'Playfair Display', serif; font-size: 18px; color: white; text-decoration: none; font-weight: 600; z-index: 2; cursor: pointer; }

/* Floating emojis */
.floating {
    position: fixed;
    bottom: 0;
    pointer-events: none;
    z-index: 3;
    opacity: 0;
    animation-name: floatSmooth;
    animation-timing-function: ease-in-out;
    animation-fill-mode: forwards;
}

/* Bears special drift */
.bear {
    --driftX: 0px;
}

/* Animation for all emojis */
@keyframes floatSmooth {
    0%   { transform: translateY(0px); opacity: 0; filter: brightness(0.8); }
    20%  { opacity: 1; filter: brightness(1.2); }
    50%  { opacity: 1; filter: brightness(1.5); }
    80%  { opacity: 1; filter: brightness(1.2); }
    100% { transform: translateY(-110vh) translateX(var(--driftX,0px)); opacity: 0; filter: brightness(0.8); }
}
</style>
</head>
<body>

<div class="open-link" onclick="openValentine()">გახსენი ბაიკო</div>

<div id="content" class="card">
    <h1>Will You Be My Valentine ბაიკო? 💘</h1>
    <button class="yes" onclick="showYes()">კი ❤️</button>
    <button class="no" id="noBtn" onmouseover="moveNo()" onclick="showNo()">არა 💔</button>
</div>

<script>
const card = document.getElementById("content");

// Open card & hide "გახსენი ბაიკო"
function openValentine() {
    card.classList.add("open");
    document.querySelector('.open-link').style.display = 'none';
}

function moveNo() {
    const btn = document.getElementById("noBtn");
    const x = Math.random()*120 - 60;
    const y = Math.random()*80 - 40;
    btn.style.transform = `translate(${x}px, ${y}px)`;
}

// Emoji arrays
const hearts = ["❤️","💖","💘"];
const bears  = ["🧸","🧸💖","💘🧸"];
const sweets = ["🍬","🍫","🍭","🍩","🍪","🥰"];

// Spawn random emoji
function spawnEmoji() {
    const choice = Math.random();
    let emoji = document.createElement("div");
    emoji.classList.add("floating");
    
    if(choice < 0.4){
        emoji.innerHTML = hearts[Math.floor(Math.random()*hearts.length)];
        emoji.style.fontSize = (18+Math.random()*12)+"px";
        emoji.style.left = Math.random()*100+"vw";
        emoji.style.animationDuration = (10+Math.random()*8)+"s"; // slow & smooth
    } else if(choice < 0.7){
        emoji.innerHTML = bears[Math.floor(Math.random()*bears.length)];
        emoji.classList.add("bear");
        emoji.style.fontSize = (28+Math.random()*12)+"px";
        emoji.style.left = Math.random()*100+"vw";
        emoji.style.setProperty('--driftX', (Math.random()*80 -40)+"px"); // slight drift
        emoji.style.animationDuration = (12+Math.random()*6)+"s"; // slow
    } else {
        emoji.innerHTML = sweets[Math.floor(Math.random()*sweets.length)];
        emoji.style.fontSize = (20+Math.random()*10)+"px";
        emoji.style.left = Math.random()*100+"vw";
        emoji.style.animationDuration = (10+Math.random()*8)+"s"; // slow & smooth
    }
    
    document.body.appendChild(emoji);
    setTimeout(()=>emoji.remove(), 15000);
}

// Spawn emojis continuously
setInterval(spawnEmoji, 500);

// Navigation
function showYes() { window.location.href="yes.html"; }
function showNo() { window.location.href="no.html"; }

</script>
</body>
</html>

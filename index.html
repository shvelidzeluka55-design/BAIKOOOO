<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>გახსენი ბაიკო</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* BODY & BACKGROUND */
body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    overflow: hidden;
}

/* CARD */
.card {
    background: white;
    border-radius: 22px;
    padding: 32px 22px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 20px 45px rgba(0,0,0,0.18);
    transform: rotateX(90deg);
    transform-origin: top;
    transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    position: relative;
    z-index: 2;
}
.card.open {
    transform: rotateX(0deg);
}

/* TITLE */
h1 {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    color: #c9184a;
    margin-bottom: 26px;
}

/* BUTTONS */
button {
    width: 100%;
    padding: 16px;
    margin: 12px 0;
    font-size: 20px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
}
.yes {
    background: linear-gradient(135deg, #ff4d6d, #ff758f);
    color: white;
}
.no {
    background: #adb5bd;
    color: white;
    position: relative;
}

/* SMALL LINK */
.open-link {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    color: white;
    text-decoration: none;
    font-weight: 600;
    z-index: 2;
    cursor: pointer;
}

/* POP EFFECT */
.pop {
    animation: popUp 0.5s ease;
}
@keyframes popUp {
    0% { opacity: 0; transform: translateY(20px) scale(0.95); }
    60% { opacity: 1; transform: translateY(-6px) scale(1.03); }
    100% { transform: translateY(0) scale(1); }
}

/* BACKGROUND HEARTS */
.bg-heart {
    position: fixed;
    bottom: -50px; /* start below screen */
    color: rgba(255,255,255,0.5);
    animation: bgFloat linear forwards;
    pointer-events: none;
    z-index: 0;
}
@keyframes bgFloat {
    0% { transform: translateY(0); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(-110vh); opacity: 0; } /* move to top */
}

/* CLICK HEARTS */
.heart {
    position: fixed;
    font-size: 22px;
    animation: floatUp 2.5s ease forwards;
    pointer-events: none;
    z-index: 3;
}
@keyframes floatUp {
    0% { opacity: 0; transform: translateY(0) scale(0.8); }
    20% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-100vh) scale(1.4); }
}

/* BEARS */
.bear {
    font-size: 34px;
    position: fixed;
    animation: bearPop 2s ease forwards;
    pointer-events: none;
    z-index: 3;
}
@keyframes bearPop {
    0% { opacity: 0; transform: scale(0.3) translateY(0); }
    40% { opacity: 1; transform: scale(1.2) translateY(-50vh); } 
    100% { opacity: 0; transform: scale(1) translateY(-100vh); }
}
</style>
</head>
<body>

<!-- Small link -->
<div class="open-link" onclick="openValentine()">გახსენი ბაიკო</div>

<!-- Main card -->
<div id="content" class="card">
    <h1>Will You Be My Valentine ბაიკო? 💘</h1>
    <button class="yes" onclick="showYes()">კი ❤️</button>
    <button class="no" id="noBtn" onmouseover="moveNo()" onclick="showNo()">არა 💔</button>
</div>

<script>
const card = document.getElementById("content");

/* Open card animation & hide link */
function openValentine() {
    card.classList.add("open");
    const link = document.querySelector('.open-link');
    link.style.display = 'none'; // hide after click
}

/* Move No button randomly */
function moveNo() {
    const btn = document.getElementById("noBtn");
    const x = Math.random() * 120 - 60;
    const y = Math.random() * 80 - 40;
    btn.style.transform = `translate(${x}px, ${y}px)`;
}

/* Spawn floating background hearts */
function spawnBgHeart() {
    const heart = document.createElement("div");
    heart.className = "bg-heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (14 + Math.random() * 26) + "px";
    heart.style.animationDuration = (6 + Math.random() * 6) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 12000);
}
setInterval(spawnBgHeart, 600);

/* Click hearts and bears animations */
function createHearts() {
    for (let i = 0; i < 6; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.style.bottom = "0px"; // start at very bottom
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 2500);
    }
}

function createBears() {
    const bears = ["🧸", "🧸💖", "💘🧸"];
    for (let i = 0; i < 3; i++) {
        const bear = document.createElement("div");
        bear.className = "bear";
        bear.innerHTML = bears[Math.floor(Math.random() * bears.length)];
        bear.style.left = Math.random() * window.innerWidth + "px";
        bear.style.bottom = "0px"; // start at very bottom
        document.body.appendChild(bear);
        setTimeout(() => bear.remove(), 2000);
    }
}

setInterval(() => { createHearts(); createBears(); }, 1000);

/* Navigation to yes.html / no.html */
function showYes() {
    window.location.href = "yes.html";
}
function showNo() {
    window.location.href = "no.html";
}
</script>

</body>
</html>

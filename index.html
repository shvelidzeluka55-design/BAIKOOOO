<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>გახსენი ბაიკო</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    overflow: hidden;
}

.card {
    background: white;
    border-radius: 22px;
    padding: 32px 22px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 20px 45px rgba(0,0,0,0.18);
    transform: rotateX(90deg);
    transform-origin: top;
    transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    position: relative;
    z-index: 2;
}
.card.open {
    transform: rotateX(0deg);
}

h1 {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    color: #c9184a;
    margin-bottom: 26px;
}

button {
    width: 100%;
    padding: 16px;
    margin: 12px 0;
    font-size: 20px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
}
.yes {
    background: linear-gradient(135deg, #ff4d6d, #ff758f);
    color: white;
}
.no {
    background: #adb5bd;
    color: white;
    position: relative;
}

.open-link {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    color: white;
    text-decoration: none;
    font-weight: 600;
    z-index: 2;
    cursor: pointer;
}

.bg-heart, .heart, .bear {
    position: fixed;
    pointer-events: none;
    z-index: 3;
    bottom: 0px; /* start from very bottom */
}

/* Smooth floating background hearts */
.bg-heart {
    color: rgba(255,255,255,0.5);
    animation-name: floatToTop;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
}
@keyframes floatToTop {
    0% { transform: translateY(0); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(-110vh); opacity: 0; }
}

/* Smooth click hearts */
.heart {
    font-size: 22px;
    animation-name: floatToTop;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
}

/* Smooth bears */
.bear {
    font-size: 34px;
    animation-name: floatToTop;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
}
</style>
</head>
<body>

<div class="open-link" onclick="openValentine()">გახსენი ბაიკო</div>

<div id="content" class="card">
    <h1>Will You Be My Valentine ბაიკო? 💘</h1>
    <button class="yes" onclick="showYes()">კი ❤️</button>
    <button class="no" id="noBtn" onmouseover="moveNo()" onclick="showNo()">არა 💔</button>
</div>

<script>
const card = document.getElementById("content");

function openValentine() {
    card.classList.add("open");
    document.querySelector('.open-link').style.display = 'none';
}

function moveNo() {
    const btn = document.getElementById("noBtn");
    const x = Math.random() * 120 - 60;
    const y = Math.random() * 80 - 40;
    btn.style.transform = `translate(${x}px, ${y}px)`;
}

// Smooth background hearts
function spawnBgHeart() {
    const heart = document.createElement("div");
    heart.className = "bg-heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (14 + Math.random()*26) + "px";
    heart.style.animationDuration = (8 + Math.random()*5) + "s"; // random speed
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(), 13000);
}
setInterval(spawnBgHeart, 500);

// Click hearts
function createHearts() {
    for(let i=0;i<6;i++){
        const heart = document.createElement("div");
        heart.className="heart";
        heart.innerHTML="❤️";
        heart.style.left = Math.random()*window.innerWidth + "px";
        heart.style.fontSize = (20 + Math.random()*10) + "px";
        heart.style.animationDuration = (2 + Math.random()*2) + "s"; // random speed
        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(), 4000);
    }
}

// Bears
function createBears() {
    const bears = ["🧸","🧸💖","💘🧸"];
    for(let i=0;i<3;i++){
        const bear = document.createElement("div");
        bear.className="bear";
        bear.innerHTML=bears[Math.floor(Math.random()*bears.length)];
        bear.style.left = Math.random()*window.innerWidth + "px";
        bear.style.fontSize = (30 + Math.random()*10) + "px";
        bear.style.animationDuration = (3 + Math.random()*2) + "s"; // random speed
        document.body.appendChild(bear);
        setTimeout(()=>bear.remove(), 5000);
    }
}

// Animate hearts and bears continuously
setInterval(()=>{ createHearts(); createBears(); }, 800);

function showYes() { window.location.href="yes.html"; }
function showNo() { window.location.href="no.html"; }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>გახსენი ბაიკო</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    overflow: hidden;
}

.card {
    background: white;
    border-radius: 22px;
    padding: 32px 22px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 20px 45px rgba(0,0,0,0.18);
    transform: rotateX(90deg);
    transform-origin: top;
    transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    position: relative;
    z-index: 2;
}
.card.open { transform: rotateX(0deg); }

h1 { font-family: 'Playfair Display', serif; font-size: 28px; color: #c9184a; margin-bottom: 26px; }

button { width: 100%; padding: 16px; margin: 12px 0; font-size: 20px; border: none; border-radius: 14px; cursor: pointer; }
.yes { background: linear-gradient(135deg, #ff4d6d, #ff758f); color: white; }
.no { background: #adb5bd; color: white; position: relative; }

.open-link { font-family: 'Playfair Display', serif; font-size: 18px; color: white; text-decoration: none; font-weight: 600; z-index: 2; cursor: pointer; }

/* Background hearts */
.bg-heart { position: fixed; bottom: 0px; color: rgba(255,255,255,0.5); z-index:0; pointer-events:none; animation-name:floatUp; animation-timing-function: linear; animation-fill-mode: forwards; }

@keyframes floatUp {
    0% { transform: translateY(0); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(-110vh); opacity: 0; }
}

/* Click hearts */
.heart { position: fixed; bottom: 0px; z-index:3; pointer-events:none; animation-name:heartFloat; animation-fill-mode: forwards; }

@keyframes heartFloat {
    0% { transform: translateY(0) scale(0.8); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(-100vh) scale(1.4); opacity: 0; }
}

/* Bears with smooth float and slight sideways drift */
.bear { position: fixed; bottom: 0px; z-index:3; pointer-events:none; animation-name:bearFloat; animation-fill-mode: forwards; }

@keyframes bearFloat {
    0% { transform: translate(0px, 0) scale(0.6); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translate(var(--driftX, 0px), -100vh) scale(1); opacity: 0; }
}
</style>
</head>
<body>

<div class="open-link" onclick="openValentine()">გახსენი ბაიკო</div>

<div id="content" class="card">
    <h1>Will You Be My Valentine ბაიკო? 💘</h1>
    <button class="yes" onclick="showYes()">კი ❤️</button>
    <button class="no" id="noBtn" onmouseover="moveNo()" onclick="showNo()">არა 💔</button>
</div>

<script>
const card = document.getElementById("content");

function openValentine() {
    card.classList.add("open");
    document.querySelector('.open-link').style.display = 'none';
}

function moveNo() {
    const btn = document.getElementById("noBtn");
    const x = Math.random()*120 - 60;
    const y = Math.random()*80 - 40;
    btn.style.transform = `translate(${x}px, ${y}px)`;
}

// Background hearts
function spawnBgHeart() {
    const heart = document.createElement("div");
    heart.className="bg-heart";
    heart.innerHTML="❤️";
    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (14 + Math.random()*26) + "px";
    heart.style.animationDuration = (8 + Math.random()*5) + "s";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),13000);
}
setInterval(spawnBgHeart, 500);

// Click hearts
function createHearts() {
    for(let i=0;i<6;i++){
        const heart=document.createElement("div");
        heart.className="heart";
        heart.innerHTML="❤️";
        heart.style.left=Math.random()*window.innerWidth+"px";
        heart.style.fontSize=(20 + Math.random()*10)+"px";
        heart.style.animationDuration=(2 + Math.random()*2)+"s";
        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),4000);
    }
}

// Bears
function createBears() {
    const bears=["🧸","🧸💖","💘🧸"];
    for(let i=0;i<3;i++){
        const bear=document.createElement("div");
        bear.className="bear";
        bear.innerHTML=bears[Math.floor(Math.random()*bears.length)];
        bear.style.left=Math.random()*window.innerWidth+"px";
        bear.style.fontSize=(30 + Math.random()*10)+"px";

        // Random sideways drift for each bear
        const driftX = (Math.random()*100 - 50) + "px";
        bear.style.setProperty('--driftX', driftX);

        bear.style.animationDuration=(3 + Math.random()*2)+"s";
        document.body.appendChild(bear);
        setTimeout(()=>bear.remove(),5000);
    }
}

// Animate hearts and bears continuously
setInterval(()=>{ createHearts(); createBears(); }, 800);

// Navigation
function showYes() { window.location.href="yes.html"; }
function showNo() { window.location.href="no.html"; }

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>კი ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    overflow: hidden;
}

/* Card */
.card {
    background: white;
    border-radius: 22px;
    padding: 32px 22px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 20px 45px rgba(0,0,0,0.18);
    position: relative;
    z-index: 2;
}

/* Title inside card */
h1 {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    color: #c9184a;
    margin-bottom: 16px;
}

/* Paragraph inside card */
p {
    font-size: 18px;
    color: #333;
    line-height: 1.5;
}

/* Floating hearts (background) */
.bg-heart {
    position: fixed;
    bottom: 0;
    color: rgba(255,255,255,0.5);
    pointer-events: none;
    z-index:0;
    animation-name: floatUp;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
}

@keyframes floatUp {
    0% { transform: translateY(0); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(-110vh); opacity: 0; }
}
</style>
</head>
<body>

<div class="card">
    <h1>შენ ჩემი ყველაზე ლამაზი ისტორია ხარ 💖</h1>
    <p>მინდა ყველა დღე შენთან ერთად დავწერო 🌹✨</p>
</div>

<script>
// Spawn background hearts continuously
function spawnBgHeart() {
    const heart = document.createElement("div");
    heart.className = "bg-heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (14 + Math.random()*26) + "px";
    heart.style.animationDuration = (8 + Math.random()*5) + "s";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),13000);
}
setInterval(spawnBgHeart, 500);
</script>

</body>
</html>
